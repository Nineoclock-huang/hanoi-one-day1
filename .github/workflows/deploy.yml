name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh source-checked Vietnamese library
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: knowledge
        continue-on-error: true
        run: npm run knowledge:update

      - name: Explain unavailable source refresh
        if: steps.knowledge.outcome == 'failure'
        run: echo 'Source refresh failed; deploying the last verified language library.'

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Save verified language library
        if: steps.knowledge.outcome == 'success'
        run: |
          git add public/knowledge/cafe.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refresh verified Vietnamese cafe language library"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
